<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nomer do'kon</title>
<meta name="theme-color" content="#070A1C">
<link rel="preload" href="/fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin>
<!-- Sahifa bot serveridan BOSHQA domenda turgan bo'lsa, bot manzilini shu yerga yozing (va bot.py da MINIAPP_ORIGINS ga shu sahifa domenini qo'shing). Bot serverining o'zidan /app orqali ochilsa — bo'sh qoldiring. -->
<meta name="api-base" content="">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>try{var _w=window.Telegram&&Telegram.WebApp,_s=_w&&_w.colorScheme;if(_s!="light"&&_s!="dark")_s=matchMedia("(prefers-color-scheme:light)").matches?"light":"dark";document.documentElement.dataset.theme=_s}catch(e){}</script>
<style>
/* Manrope o'z serverimizdan: /fonts/manrope-latin.woff2 (bot.py: papka fonts/). Fayl bo'lmasa — tizim shrifti, sahifa kutib qolmaydi. */
@font-face{font-family:Manrope;font-style:normal;font-weight:200 800;font-display:swap;src:url(/fonts/manrope-latin.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
/* ============ TOKENS ============
   Palet: tun ko'k (#070A1C) fon, #0F1538 panel, #5B6BFF asosiy rang; xizmatlar o'z rangida (Stars oltin, Premium binafsha, Raqam yashil, UC to'q sariq).
   Harakat (animatsiya) FAQAT <html class="fx"> bo'lganda ishlaydi — fx yo'q bo'lsa barcha elementlar tayyor (yakuniy) holatda turadi. */
:root{--bg:#070A1C;--panel:#0F1538;--soft:#192049;--line:#242D63;--tx:#F5F6FF;--mut:#8E99D8;--pri:#5B6BFF;--link:#8A9BFF;--ok:#3EE0AE;--wn:#FFC83D;--bad:#FF6B81;--rgb:91,107,255;--glass:rgba(15,21,56,.85);--navbg:rgba(15,21,56,.96);--navg:rgba(15,21,56,.8);--navgx:rgba(15,21,56,.5);--veil:rgba(255,255,255,.07);--scrim:rgba(5,6,20,.62);--sh:rgba(0,0,0,.25);--sh2:rgba(0,0,0,.45);--g1:rgba(112,92,255,.34);--g2:rgba(36,132,255,.2);--notet:#FFE9A8;--demob:#2B2819;--badt:#FF8A9B;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Yorug' rejim. Fon/matn ranglarini JS (THEME) Telegram themeParams'idan ustiga yozadi; bu yerda — themeParams bo'lmasa ishlatiladigan
   tayyor palitra va rejimga bog'liq qolgan tonlar. --ct: xizmat rangining matn/belgi uchun to'qroq varianti (oltin matn oq fonda o'qilmaydi). */
:root[data-theme="light"]{--bg:#EEF0F8;--panel:#FFFFFF;--soft:#F0F2FC;--line:#DDE0F5;--tx:#12163A;--mut:#5F6590;--pri:#4256E8;--link:#4256E8;--ok:#0A7F58;--wn:#A04A00;--bad:#C21F42;--rgb:66,86,232;color-scheme:light;
--glass:rgba(255,255,255,.88);--navbg:rgba(255,255,255,.97);--navg:rgba(255,255,255,.82);--navgx:rgba(255,255,255,.55);--veil:rgba(20,30,90,.06);--scrim:rgba(15,20,50,.5);--sh:rgba(40,50,110,.14);--sh2:rgba(40,50,110,.24);--g1:rgba(112,92,255,.16);--g2:rgba(36,132,255,.1);--notet:#7A4B00;--demob:#FFF3D1;--badt:#C21F42}
:root[data-theme="light"] .t-stars{--ct:#9A5500}:root[data-theme="light"] .t-premium{--ct:#5B3FD6}:root[data-theme="light"] .t-raqam{--ct:#087A56}:root[data-theme="light"] .t-uc{--ct:#C2410C}:root[data-theme="light"] .t-topup{--ct:#3347D9}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px);overscroll-behavior-y:contain;-webkit-text-size-adjust:100%;text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;color:var(--tx);font:500 15px/1.4 Manrope,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(80% 36% at 88% -6%,var(--g1),transparent 72%),radial-gradient(70% 30% at 0 4%,var(--g2),transparent 72%)}
button{font:inherit;color:inherit;cursor:pointer;margin:0;-webkit-appearance:none;appearance:none}
button:focus-visible,.in:focus-visible,.drop:focus-visible,.ord:focus-visible{outline:2px solid var(--link);outline-offset:2px}
.t-stars{--c:#FFB938;--cx:#2B2000;--rgb:255,185,56}.t-premium{--c:#8E7BFF;--cx:#fff;--rgb:142,123,255}.t-raqam{--c:#19D79B;--cx:#00261A;--rgb:25,215,155}.t-uc{--c:#FF7A2F;--cx:#2B1100;--rgb:255,122,47}.t-topup{--c:#5B6BFF;--cx:#fff;--rgb:91,107,255}
#app{max-width:480px;margin:0 auto;padding:18px 16px 108px}
.mut{color:var(--mut)}

/* ============ SARLAVHA ============ */
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.who{flex:1;min-width:0}
.who b{display:block;font-size:20px;font-weight:800;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who small{color:var(--link);font-size:14px;font-weight:600}
.av{width:54px;height:54px;flex:none;border-radius:19px;background:linear-gradient(145deg,#4D7BFF,#7236F2);color:#fff;display:grid;place-items:center;font:800 italic 25px Manrope,sans-serif;box-shadow:0 0 0 2px rgba(255,255,255,.1),0 8px 22px rgba(86,92,255,.42);cursor:pointer}
.fxb{flex:none;width:42px;height:42px;padding:0;border-radius:50%;border:1px solid var(--line);background:var(--glass);color:var(--link);display:grid;place-items:center}
.fxb>span{display:grid;place-items:center}.fxb svg{width:20px;height:20px}
.fxb>.off{display:none}html:not(.fx) .fxb>.on{display:none}html:not(.fx) .fxb>.off{display:grid}html:not(.fx) .fxb{color:var(--mut)}
.chip{--rgb:255,200,61;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:rgba(var(--rgb),.16);color:var(--c,var(--wn));white-space:nowrap}
.chip.ok{--c:var(--ok);--rgb:62,224,174}.chip.wait{--c:var(--wn);--rgb:255,200,61}.chip.bad{--c:var(--bad);--rgb:255,107,129}.chip.ref{--c:var(--mut);--rgb:142,153,216}
.demob{position:sticky;top:0;z-index:6;padding:6px 12px;text-align:center;font-size:12px;font-weight:700;color:var(--wn);background:var(--demob);border-bottom:1px solid rgba(255,200,61,.35)}.demob[hidden]{display:none}

/* ============ BALANS KARTASI (asosiy e'tibor shu yerda) ============ */
.bal{position:relative;overflow:hidden;border-radius:30px;padding:20px;min-height:186px;color:#fff;
background:linear-gradient(120deg,#1534E8,#3846F5 55%,#5B3AF0);
background:radial-gradient(circle at 100% 100%,transparent 0 34%,rgba(255,255,255,.07) 34% 35%,transparent 35% 48%,rgba(255,255,255,.055) 48% 49%,transparent 49% 62%,rgba(255,255,255,.04) 62% 63%,transparent 63%),radial-gradient(80% 110% at 100% 100%,#8B3CFF,transparent 62%),linear-gradient(120deg,#1534E8,#3846F5 55%,#5B3AF0);
box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 0 0 1px rgba(120,150,255,.5),0 16px 42px rgba(60,70,255,.36)}
.bal>:not(.wal){position:relative;z-index:1}
.bal::after{content:"";position:absolute;top:0;bottom:0;left:0;width:60%;transform:translateX(-130%);background:linear-gradient(100deg,transparent,rgba(255,255,255,.24),transparent);pointer-events:none}
.wal{position:absolute;right:8px;top:14px;width:min(36%,140px)}
.bl{display:flex;align-items:center;gap:10px;font-weight:700}
.wi{width:34px;height:28px;border-radius:9px;background:#DCE6FF;color:#2F46E8;display:grid;place-items:center}.wi svg{width:20px}
.amt{font:800 clamp(34px,10.5vw,46px)/1.1 Manrope,sans-serif;letter-spacing:-.02em;margin:10px 0;white-space:nowrap}.amt em{font:700 18px Manrope,sans-serif;font-style:normal;opacity:.8;letter-spacing:0}
.act{display:flex;width:max-content;align-items:center;gap:8px;padding:4px 14px 4px 5px;border-radius:99px;background:rgba(20,200,140,.32);color:#D3FBEC;font-size:13px;font-weight:700}.act svg{width:22px}
.act.wt{background:rgba(255,200,61,.26);color:#FFE9A8}
.btn{display:flex;width:max-content;align-items:center;gap:10px;margin-top:14px;border:0;border-radius:99px;background:#fff;color:#2F46E8;font-weight:800;font-size:16px;padding:8px 14px 8px 8px;box-shadow:0 6px 18px rgba(8,10,60,.35)}
.btn svg{width:16px}.pl{width:30px;height:30px;border-radius:50%;background:#2F46E8;color:#fff;display:grid;place-items:center}

/* ============ XIZMAT KARTALARI ============ */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0 18px}
.tile{position:relative;overflow:hidden;display:block;width:100%;text-align:left;padding:14px;border-radius:24px;border:1px solid rgba(var(--rgb),.3);background:linear-gradient(150deg,rgba(var(--rgb),.24),rgba(var(--rgb),.05) 62%),var(--panel);box-shadow:inset 0 1px 0 var(--veil),0 8px 22px var(--sh)}
.tile::before{content:"";position:absolute;z-index:0;right:-34px;top:-34px;width:110px;height:110px;border-radius:50%;background:radial-gradient(circle,rgba(var(--rgb),.34),transparent 70%);pointer-events:none}
.tile>*{position:relative;z-index:1}
.tile:active{transform:scale(.96)}
.th{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.cv{width:34px;height:34px;border-radius:50%;background:var(--veil);display:grid;place-items:center}.cv svg{width:16px}
.tile h3{margin:0;font-size:18px;font-weight:800;letter-spacing:-.01em}.tile p{margin:2px 0 0;color:var(--mut);font-size:13px}
.ico{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;color:var(--ct,var(--c));background:linear-gradient(150deg,rgba(var(--rgb),.42),rgba(var(--rgb),.12));border:1px solid rgba(var(--rgb),.45);box-shadow:0 6px 16px rgba(var(--rgb),.22),inset 0 1px 0 rgba(255,255,255,.12)}
.ico svg{width:30px;height:30px}

/* ============ PANELLAR, BUYURTMALAR ============ */
.pan{background:var(--panel);border:1px solid var(--line);border-radius:26px;padding:4px 14px;box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.ord{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.ord>div:nth-child(2){min-width:0;overflow-wrap:anywhere}
.pg+.pan .ord:first-child{border-top:0}
.ord .ico{width:46px;height:46px;border-radius:15px}.ord .ico svg{width:26px;height:26px}
.ord small{display:block;color:var(--mut)}.ord .r{text-align:right}.ord .r b{display:block;font-weight:800}.ord .r b span{color:var(--mut);font-weight:600}
.ord:active{transform:scale(.98)}
.cv2{color:var(--mut)}.cv2 svg{width:16px;display:block}
.pg{margin:4px 0 16px;font-size:24px;font-weight:800;letter-spacing:-.015em}

/* ============ SOZLAMALAR (animatsiya o'chirgich) ============ */

/* ============ PASTKI MENYU ============ */
.nav{position:fixed;left:8px;right:8px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:456px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);background:var(--navg);border:1px solid var(--line);border-radius:30px;box-shadow:0 12px 32px var(--sh2),inset 0 1px 0 var(--veil);z-index:5}
.nav:empty{display:none}
.nav>button{position:relative;display:grid;justify-items:center;gap:3px;padding:12px 0 15px;background:none;border:0;color:var(--mut);font-size:9.5px;font-weight:700;white-space:nowrap}
.nav svg{width:24px;height:24px}
.nav>button.on{color:var(--link)}.nav>button.on::after{content:"";position:absolute;bottom:5px;width:18px;height:3px;border-radius:3px;background:var(--link);box-shadow:0 0 10px var(--link)}
.nav>button:active{transform:scale(.9)}
.qk{display:flex;align-items:center;gap:12px;font-size:16px}.qk .ico{width:44px;height:44px;border-radius:14px}.qk .ico svg{width:24px;height:24px}
.opt.wide>svg{width:16px;color:var(--mut)}

/* ============ PASTKI OYNA (sheet) ============ */
.ov{position:fixed;inset:0;background:var(--scrim);opacity:0;pointer-events:none;z-index:10}
.ov.on{opacity:1;pointer-events:auto}
.sh{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;background:linear-gradient(180deg,rgba(var(--rgb),.1),transparent 120px) no-repeat,var(--panel);border-radius:28px 28px 0 0;border-top:1px solid rgba(var(--rgb),.3);padding:10px 18px calc(18px + env(safe-area-inset-bottom,0px));transform:translateY(105%);visibility:hidden;z-index:11;max-height:88vh;max-height:88dvh;overflow:auto;overscroll-behavior:contain}
.sh.on{transform:none;visibility:visible}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 14px}
.hd{display:flex;align-items:center;gap:10px;margin-bottom:6px}.hd .ico{margin:0;width:40px;height:40px}
.hd h2{margin:0;font:800 18px Manrope,sans-serif}
label{display:block;margin:14px 0 8px;font-weight:700;font-size:13px;color:var(--mut)}
.in{width:100%;background:var(--soft);border:1.5px solid transparent;border-radius:14px;padding:14px;color:var(--tx);font:700 16px Manrope,sans-serif;outline:none}
.in:focus{border-color:var(--c,var(--pri));box-shadow:0 0 0 4px rgba(var(--rgb),.22)}.row+.in{margin-top:10px}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.row.two{grid-template-columns:1fr 1fr}.list{display:grid;gap:8px}
.opt{background:var(--soft);border:1.5px solid transparent;border-radius:14px;padding:12px 8px;font-weight:700;font-size:14px;color:var(--tx)}
.opt small{display:block;margin-top:2px;color:var(--mut);font-weight:500;font-size:12px}
.opt.sel{border-color:var(--c);color:var(--ct,var(--c));box-shadow:0 0 0 3px rgba(var(--rgb),.16)}.opt.sel small{color:var(--mut)}
.opt.wide{display:flex;justify-content:space-between;align-items:center;text-align:left;padding:13px 14px}
.opt:active{transform:scale(.96)}
.sum{display:flex;justify-content:space-between;margin-top:16px;padding:12px 0;border-top:1px dashed var(--line);color:var(--mut)}.sum b{color:var(--tx)}
.hold{position:relative;width:100%;height:56px;border:0;border-radius:99px;background:var(--c);color:var(--cx);font-weight:800;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none;box-shadow:0 8px 22px rgba(var(--rgb),.3)}
.hold i{position:absolute;inset:0;background:rgba(0,0,0,.25);transform-origin:left;transform:scaleX(0)}
.hold span{position:relative}
.hold:disabled{background:var(--soft);color:var(--mut);cursor:default;box-shadow:none}
.btn2{width:100%;height:54px;border:0;border-radius:99px;background:var(--pri);color:#fff;font-weight:800;margin-top:14px;box-shadow:0 8px 20px rgba(91,107,255,.28)}
.btn2:active{transform:scale(.97)}
.btn2:disabled{background:var(--soft);color:var(--mut);cursor:default;box-shadow:none}
.btn2.two{height:auto;min-height:54px;padding:10px 16px;line-height:1.25;border-radius:22px}.btn2 small{display:block;margin-top:2px;font-weight:600;font-size:12px;opacity:.78}
.btn2.ghost{background:var(--soft);color:var(--tx);box-shadow:none}
.btn2.dng{background:transparent;color:var(--badt);box-shadow:inset 0 0 0 1.5px rgba(255,107,129,.45)}
.hint{margin:10px 0 0;text-align:center;color:var(--mut);font-size:13px;min-height:18px}.hint a{color:var(--link);font-weight:700;text-decoration:underline;cursor:pointer}
.hint.err{color:var(--badt);margin-top:8px}
.card{display:grid;gap:4px;margin-top:16px;padding:16px;border-radius:18px;background:linear-gradient(135deg,#2A2E9E,#3B2FB5);color:#fff;position:relative;overflow-wrap:anywhere}
.card small{opacity:.7}.card b{font:800 17px Manrope,sans-serif;letter-spacing:.04em}
.card .cp{position:absolute;right:14px;top:14px;background:rgba(255,255,255,.18);color:#fff}
.cp{border:0;border-radius:99px;background:rgba(var(--rgb),.2);color:var(--link);font-weight:700;font-size:13px;padding:7px 12px}
.cp:active{transform:scale(.94)}
.resume{display:flex;align-items:center;justify-content:space-between;width:100%;margin:12px 0 0;padding:12px 14px;border-radius:16px;border:1.5px solid rgba(255,200,61,.45);background:rgba(255,200,61,.12);color:var(--tx);text-align:left}
.resume span{display:grid;gap:2px;font-size:12px;color:var(--mut)}.resume b{font-size:16px;color:var(--wn)}.resume svg{width:16px;color:var(--mut)}
.pc{margin-top:12px;padding:4px 16px;border-radius:18px;background:linear-gradient(135deg,#2A2E9E,#3B2FB5);color:#fff}
.pr{display:grid;grid-template-columns:1fr auto;column-gap:10px;row-gap:2px;align-items:center;padding:11px 0;border-top:1px solid rgba(255,255,255,.14)}.pr:first-child{border-top:0}
.pr small{grid-column:1;opacity:.7}.pr b{grid-column:1;font:800 17px Manrope,sans-serif;letter-spacing:.03em;overflow-wrap:anywhere}
.pr .cp{grid-column:2;grid-row:1/3;background:rgba(255,255,255,.18);color:#fff}
.tm{display:flex;align-items:baseline;justify-content:center;gap:8px;margin:16px 0 8px}.tm b{font:800 30px Manrope,sans-serif;font-variant-numeric:tabular-nums}.tm b.dim{color:var(--wn)}.tm small{color:var(--mut);font-size:13px}
.bar{height:4px;border-radius:4px;background:var(--soft);overflow:hidden}.bar i{display:block;height:100%;background:var(--c,var(--pri));transform-origin:left}
.note{margin:12px 0 0;padding:10px 12px;border-radius:12px;background:rgba(255,200,61,.12);color:var(--notet);font-size:13px}
.drop{display:flex;align-items:center;justify-content:center;gap:10px;min-height:92px;margin:10px 0 0;padding:12px;border:1.5px dashed var(--line);border-radius:16px;background:var(--soft);color:var(--tx);font-size:14px;font-weight:700;text-align:center;cursor:pointer}
.drop>span{display:flex;align-items:center;gap:10px;text-align:left}
.drop svg{width:26px;flex:none;color:var(--link)}.drop small{display:block;color:var(--mut);font-weight:500;font-size:12px}
.th2{width:64px;height:64px;border-radius:12px;object-fit:cover;flex:none}

.sh.buy{display:flex;flex-direction:column;overflow:hidden;padding-bottom:0}
.sh.buy .grab,.sh.buy .hd{flex:none}
.sh.buy .sbody{flex:1 1 auto;min-height:0;overflow:auto;overscroll-behavior:contain;margin:0 -18px;padding:0 18px 10px}
.sh.buy .sfoot{flex:none;margin:0 -18px;padding:4px 18px calc(14px + env(safe-area-inset-bottom,0px));background:var(--panel);border-top:1px solid var(--line)}
.sh.buy .sfoot .sum{margin-top:6px;padding:8px 0}
.av{position:relative;overflow:hidden}.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

/* --- Raqam oynasi: pastki panel davlat tanlangach chiqadi --- */
.sh.buy .sfoot[hidden]{display:none}
.sh.buy.nofoot .sbody{padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
@keyframes sfin{from{transform:translateY(100%);opacity:0}to{transform:none;opacity:1}}
html.fx .sfoot.pop{animation:sfin .3s cubic-bezier(.2,.9,.3,1) both}
/* --- Ixcham profil --- */

/* ============ PROFIL ============ */
.pfh{position:relative;overflow:hidden;border-radius:28px;padding:18px;color:#fff;background:radial-gradient(circle at 100% 0,transparent 0 30%,rgba(255,255,255,.07) 30% 31%,transparent 31% 44%,rgba(255,255,255,.055) 44% 45%,transparent 45% 58%,rgba(255,255,255,.04) 58% 59%,transparent 59%),radial-gradient(80% 120% at 0 100%,#8B3CFF,transparent 60%),linear-gradient(120deg,#1534E8,#3846F5 55%,#5B3AF0);box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 0 0 1px rgba(120,150,255,.5),0 16px 42px rgba(60,70,255,.3)}
.pfi{display:flex;align-items:center;gap:14px}.pfi>div{min-width:0}
.pfi .av{width:62px;height:62px;border-radius:21px;font-size:28px;cursor:default;box-shadow:0 0 0 3px rgba(255,255,255,.32),0 8px 20px rgba(10,10,80,.4)}
.pfi b{display:block;font-size:20px;font-weight:800;line-height:1.2;overflow-wrap:anywhere}
.pfi small{display:block;margin-top:3px;color:rgba(255,255,255,.8);font-size:13.5px;font-weight:600;overflow-wrap:anywhere}
.pfs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.18)}
.pfs>div{padding:0 8px;border-left:1px solid rgba(255,255,255,.16)}.pfs>div:first-child{padding-left:0;border-left:0}
.pfs b{display:block;font:800 17px Manrope,sans-serif;overflow-wrap:anywhere}

["pointerup","pointerleave","pointercancel"].forEach(ev=>h.addEventListener(ev,()=>{cancelAnimationFrame(raf);if(!done&&ev=="pointerup"&&t0&&!h.disabled)toast("Tugmani 1 soniya bosib turing");if(!done){f.style.transition="transform .25s";f.style.transform="scaleX(0)"}}));

/* ===== BALANSNI TO'LDIRISH =====
   1) Avto-to'lov: server unikal summa + karta beradi, foydalanuvchi o'tkazadi, bot to'lovni o'zi aniqlab balansni to'ldiradi.
   2) Chek yuborish: foydalanuvchi chek rasmini yuklaydi, u adminlarga boradi va admin tasdiqlaydi (botdagidek). */
const TP={poll:0,cd:0,run:false,id:0,busy:0};
function tpStop(){clearTimeout(TP.poll);clearInterval(TP.cd);TP.poll=TP.cd=0;TP.run=false;TP.id++}
const tHead=t=>`<div class="grab"></div><div class="hd"><div class="ico">${IC.topup}</div><h2>${esc(t)}</h2></div>`;
const setErr=m=>{const e=$("#te");if(e){e.textContent=m||"";e.className="hint";if(m){void e.offsetWidth;e.className="hint err shk"}}};
const lim=()=>({mn:(ME&&ME.min_topup)||5000,mx:(ME&&ME.max_topup)||100000000});
const pNow=p=>p.server_time+(Date.now()-p._t0)/1000;   /* server soati bo'yicha "hozir": telefon soati noto'g'ri bo'lsa ham to'g'ri chiqadi */
const fsz=n=>n>=1048576?(n/1048576).toFixed(1)+" MB":Math.max(1,Math.round(n/1024))+" KB";
const uuid=()=>{try{return crypto.randomUUID()}catch(e){return Date.now().toString(36)+Math.random().toString(36).slice(2,12)}};
function openUrl(u){if(!/^https?:\/\//i.test(u))return;try{if(tg&&/^https:\/\/t\.me\//i.test(u)&&tg.openTelegramLink)tg.openTelegramLink(u);else if(tg&&tg.openLink)tg.openLink(u);else window.open(u,"_blank")}catch(e){}}
/* kirish cheklovlari (bloklangan / kanalga a'zo emas / initData eskirgan): sahifa o'rniga tushuntirish ko'rsatiladi */
function gateErr(e){if(e&&(e.code=="auth"||e.code=="banned"||e.code=="subscribe"||e.code=="phone")){fail(e);return true}return false}

function topup(a0){tpStop();
const a=+a0>0?Math.round(+a0):50000,mn=lim().mn,ready=!!(ME&&ME.autopay&&ME.autopay.ready),op=ME&&ME.open_payment,chips=[20000,50000,100000],s=$("#sh");
const resume=!!(op&&op._t0!=null&&op.expires_at-pNow(op)>10);
cur={t:"topup",a};s.className="sh t-topup";
s.innerHTML=`${tHead("Balansni to'ldirish")}${resume?`<button class="resume" id="tr"><span>Kutilayotgan avto-to'lov<b>${fmt(op.amount)} so'm</b></span>${IC.chev}</button>`:""}<label>Summa (eng kami ${fmt(mn)} so'm)</label><div class="row">${chips.map(n=>`<button class="opt${n==a?" sel":""}" data-a="${n}">${fmt(n)}</button>`).join("")}</div><input class="in" id="n" inputmode="numeric" placeholder="Boshqa summa" autocomplete="off" value="${chips.indexOf(a)<0?a:""}">${ready?`<button class="btn2 two" id="ta">Avto-to'lov<small>Karta orqali o'tkazing — balans o'zi to'ldiriladi</small></button>`:'<p class="hint">Avto-to\'lov hozir mavjud emas.</p>'}<button class="btn2 two${ready?" ghost":""}" id="tm">Chek yuborish<small>Chekni yuklang — admin tasdiqlaydi</small></button><p class="hint" id="te"></p>`;
const inp=$("#n"),opts=s.querySelectorAll(".opt"),chk=()=>{const v=+cur.a||0,l=lim();
if(!v){setErr("Summani tanlang yoki kiriting");return 0}
if(v<l.mn){setErr("Eng kami "+fmt(l.mn)+" so'm");return 0}
if(v>l.mx){setErr("Eng ko'pi "+fmt(l.mx)+" so'm");return 0}return v};
opts.forEach(b=>b.onclick=()=>{hap();opts.forEach(x=>x.classList.remove("sel"));b.classList.add("sel");cur.a=+b.dataset.a;inp.value="";setErr("")});
inp.oninput=()=>{opts.forEach(x=>x.classList.remove("sel"));const v=inp.value.replace(/\D/g,"").slice(0,9);if(v!==inp.value)inp.value=v;cur.a=v?+v:0;setErr("")};
const ta=$("#ta");if(ta)ta.onclick=()=>{const v=chk();if(v)autoFlow(v)};
$("#tm").onclick=()=>{const v=chk();if(v)manualFlow(v)};
const tr=$("#tr");if(tr)tr.onclick=()=>autoShow(op);
show(true)}

async function autoFlow(a){const b=$("#ta"),m=$("#tm");if(!b||b.disabled)return;b.disabled=true;if(m)m.disabled=true;setErr("");
try{const r=await call("/api/topup/auto",{body:{amount:a}}),p=r.payment;p._t0=Date.now();ME.open_payment=p;
if(!$("#sh").classList.contains("on"))return;           /* so'rov ketayotganda oyna yopilgan — to'lov "kutilayotgan" bo'lib qoladi */
autoShow(p)}
catch(e){if(gateErr(e))return;const b2=$("#ta"),m2=$("#tm");if(b2)b2.disabled=false;if(m2)m2.disabled=false;
if(e.code=="autopay_unavailable"){ME.autopay=Object.assign({},ME.autopay,{ready:false});return topup(a)}
setErr(e.message)}}

function autoShow(p){tpStop();TP.run=true;if(p._t0==null)p._t0=Date.now();cur={t:"topup",a:p.base||p.amount,p};
const s=$("#sh"),row=(l,v,c)=>`<div class="pr"><small>${l}</small><b>${esc(v)}</b><button class="cp" data-c="${esc(c)}">Nusxalash</button></div>`;
s.className="sh t-topup";
s.innerHTML=`${tHead("Avto-to'lov")}<div class="pc">${row("O'tkaziladigan summa",fmt(p.amount)+" so'm",p.amount)}${row("Karta raqami",p.card_number,p.card_raw||p.card_number)}${p.card_holder?`<div class="pr"><small>Karta egasi</small><b>${esc(p.card_holder)}</b></div>`:""}</div><div class="tm"><b id="tl">--:--</b><small>qoldi</small></div><div class="bar"><i id="tb"></i></div><p class="note">Summa aynan shunday bo'lishi shart${p.extra?`: oxirgi ${fmt(p.extra)} so'm to'lovni aniqlash uchun qo'shilgan (u ham balansingizga tushadi)`:""}. To'lov tushishi bilan balans o'zi to'ldiriladi.</p><div class="waitl" id="wl"><span class="dots"><i></i><i></i><i></i></span> To'lov kutilmoqda</div><button class="btn2 ghost" id="pm">Chek yuborish (qo'lda)</button><button class="btn2 dng" id="pc">Bekor qilish</button><p class="hint" id="te"></p>`;
s.querySelectorAll(".cp").forEach(b=>b.onclick=()=>copy(b.dataset.c));
$("#pm").onclick=()=>toManual(p);$("#pc").onclick=()=>cancelAuto(p);
show(true);tick(p);TP.cd=setInterval(()=>tick(p),1000);poll(p)}

function tick(p){const l=$("#tl"),b=$("#tb");if(!l)return;
const left=p.expires_at-pNow(p),total=Math.max(60,(p.ttl_min||20)*60);
if(left>0){const m=Math.floor(left/60),x=Math.floor(left%60);l.textContent=m+":"+String(x).padStart(2,"0");l.classList.remove("dim");if(b)b.style.transform="scaleX("+Math.max(0,Math.min(1,left/total))+")"}
else{l.textContent="0:00";l.classList.add("dim");if(b)b.style.transform="scaleX(0)";
const w=$("#wl");if(w&&!w.dataset.late){w.dataset.late="1";w.innerHTML='<span class="dots"><i></i><i></i><i></i></span> Vaqt tugadi. Pul o\'tkazgan bo\'lsangiz, bir oz kuting…'}}}

/* holatni so'rash: har ~4 soniyada; ilovaga qaytganda (bank ilovasidan) darhol */
function poll(p,d){const id=TP.id;clearTimeout(TP.poll);TP.poll=setTimeout(()=>check(p,id),d==null?4000:d)}
async function check(p,id){if(!TP.run||TP.id!==id||TP.busy===id)return;TP.busy=id;
try{const r=await call("/api/topup/auto/status?id="+p.id);if(!TP.run||TP.id!==id)return;
p.server_time=r.server_time;p._t0=Date.now();
if(r.status=="paid")return paid(r);
if(r.status=="cancelled")return gone("To'lov bekor qilingan.",p);
if(r.status=="expired"||r.server_time>r.expires_at+(r.grace||0))return gone("To'lov muddati tugadi. Pul o'tkazgan bo'lsangiz — chek yuboring, admin tekshiradi.",p)}
catch(e){if(!TP.run||TP.id!==id)return;if(gateErr(e))return;if(e.code=="not_found")return gone("So'rov topilmadi.",p)}
finally{if(TP.busy===id)TP.busy=0}
if(TP.run&&TP.id===id)poll(p)}

function paid(r){tpStop();LS++;const old=bal;bal=r.balance!=null?r.balance:old+(+r.amount||0);
if(ME){ME.open_payment=null;ME.balance=bal}
paint(old);show(false);hap();
win("topup","+"+fmt(r.amount)+" so'm",{h:"To'lov qabul qilindi",x:`<p class="mut">Yangi balans: <b style="color:var(--tx)">${fmt(bal)} so'm</b></p>`})}

function gone(m,p){tpStop();if(ME)ME.open_payment=null;const a=(p&&(p.base||p.amount))||cur.a,s=$("#sh");
s.className="sh t-topup";
s.innerHTML=`${tHead("To'lov yakunlanmadi")}<p class="mut" style="margin:14px 0 0">${esc(m)}</p><button class="btn2" id="g1">Qayta urinish</button><button class="btn2 ghost" id="g2">Chek yuborish</button>`;
$("#g1").onclick=()=>topup(a);$("#g2").onclick=()=>manualFlow(a);show(true)}

/* bot bilan bir xil: avto-to'lovdan qo'lda usulga o'tilsa, avto-so'rov bekor qilinadi (to'lov allaqachon tushgan bo'lsa — bekor bo'lmaydi) */
async function toManual(p){const b=$("#pm"),c=$("#pc");if(!b||b.disabled)return;b.disabled=true;if(c)c.disabled=true;setErr("");
try{const r=await call("/api/topup/auto/cancel",{body:{id:p.id}});
if(r.status=="paid")return paid(await call("/api/topup/auto/status?id="+p.id));
if(ME)ME.open_payment=null;manualFlow(p.base||p.amount)}
catch(e){if(gateErr(e))return;const b2=$("#pm"),c2=$("#pc");if(b2)b2.disabled=false;if(c2)c2.disabled=false;setErr(e.message)}}

async function cancelAuto(p){const b=$("#pc"),m=$("#pm");if(!b||b.disabled)return;b.disabled=true;if(m)m.disabled=true;setErr("");
try{const r=await call("/api/topup/auto/cancel",{body:{id:p.id}});
if(r.status=="paid")return paid(await call("/api/topup/auto/status?id="+p.id));
if(ME)ME.open_payment=null;toast("Bekor qilindi");topup(p.base||p.amount)}
catch(e){if(gateErr(e))return;const b2=$("#pc"),m2=$("#pm");if(b2)b2.disabled=false;if(m2)m2.disabled=false;setErr(e.message)}}

/* katta rasmni kichraytiradi (tez yuklanishi uchun) va JPG/PNG/WEBP bo'lmagan formatni (masalan HEIC) JPG ga aylantiradi */
async function shrink(f){const ok=/^image\/(jpeg|png|webp)$/.test(f.type);if(ok&&f.size<=1258291)return f;
try{const bm=await createImageBitmap(f),k=Math.min(1,1920/Math.max(bm.width,bm.height)),w=Math.max(1,Math.round(bm.width*k)),h=Math.max(1,Math.round(bm.height*k));
const cv=document.createElement("canvas");cv.width=w;cv.height=h;const cx=cv.getContext("2d");cx.fillStyle="#fff";cx.fillRect(0,0,w,h);cx.drawImage(bm,0,0,w,h);if(bm.close)bm.close();
const blob=await new Promise(r=>cv.toBlob(r,"image/jpeg",.86));if(blob&&(!ok||blob.size<f.size))return blob}catch(e){}
return f}

function manualFlow(a){tpStop();cur={t:"topup",a};
const c=(ME&&ME.card)||{},num=String(c.number||"").trim(),tok=uuid(),s=$("#sh");let file=null,prev="";
s.className="sh t-topup";
s.innerHTML=`${tHead("Chek yuborish")}<div class="sum"><span>O'tkaziladigan summa</span><b>${fmt(a)} so'm</b></div>${num?`<div class="card"><small>Karta raqami</small><b>${esc(num)}</b>${c.holder?`<small>${esc(c.holder)}</small>`:""}<button class="cp" id="cc">Nusxalash</button></div>`:'<p class="note">Karta ma\'lumoti kiritilmagan. Admin bilan bog\'laning.</p>'}<p class="hint" style="margin-top:12px">Pulni o'tkazgach, to'lov chekining skrinshotini yuklang. Admin tasdiqlagach balansingiz to'ldiriladi.</p><label class="drop" id="dz" tabindex="0"><input type="file" id="ph" accept="image/*" hidden><span id="dl">${IC.cam}<span>Chek rasmini tanlang<small>JPG yoki PNG</small></span></span></label><button class="btn2" id="sd" disabled>Adminga yuborish</button><button class="btn2 ghost" id="bk">Orqaga</button><p class="hint" id="te"></p>`;
const ph=$("#ph"),sd=$("#sd"),bk=$("#bk"),dz=$("#dz"),rel=()=>{if(prev){URL.revokeObjectURL(prev);prev=""}};
const cc=$("#cc");if(cc)cc.onclick=()=>copy(num.replace(/\D/g,"")||num);
dz.onkeydown=e=>{if(e.key=="Enter"||e.key==" "){e.preventDefault();ph.click()}};
ph.onchange=()=>{const f=ph.files&&ph.files[0];setErr("");rel();
if(!f){file=null;sd.disabled=true;return}
if(!/^image\//.test(f.type)&&!/\.(jpe?g|png|webp|heic|heif)$/i.test(f.name)){file=null;sd.disabled=true;return setErr("Faqat rasm yuklang (JPG yoki PNG)")}
file=f;prev=URL.createObjectURL(f);
$("#dl").innerHTML=`<img class="th2" alt="" src="${prev}"><span>${esc(f.name.length>26?f.name.slice(0,23)+"…":f.name)}<small>${fsz(f.size)} · almashtirish uchun bosing</small></span>`;sd.disabled=false};
bk.onclick=()=>{rel();topup(a)};
sd.onclick=async()=>{if(!file||sd.disabled)return;sd.disabled=bk.disabled=true;setErr("");const lb=sd.textContent;sd.textContent="Yuborilmoqda…";
try{const blob=await shrink(file),fd=new FormData();fd.append("amount",String(a));fd.append("token",tok);fd.append("photo",blob,"check.jpg");
const r=await call("/api/topup/manual",{body:fd,timeout:90000});rel();
ME.pending_topups=r.pending_topups!=null?r.pending_topups:(ME.pending_topups||0)+1;
show(false);pill();hap();
win("topup",fmt(a)+" so'm",{h:"Chek adminga yuborildi",x:'<p class="mut">Admin tasdiqlagach balansingiz to\'ldiriladi. Natija botda xabar bo\'lib keladi.</p>'})}
catch(e){if(gateErr(e))return;sd.disabled=bk.disabled=false;sd.textContent=lb;setErr(e.message)}};
show(true)}

/* ===== Ishga tushirish va xatolar ===== */
function fail(e){tpStop();show(false);$("#win").classList.remove("on");$("#nav").innerHTML="";
const a=$("#app"),code=e&&e.code,ch=(e&&e.data&&e.data.channels)||[],msg=esc((e&&e.message)||"Xatolik yuz berdi");
if(code=="subscribe"){
a.innerHTML=`<div class="gate"><h2>Kanalga a'zo bo'ling</h2><p class="mut">${msg}</p>${ch.map((c,i)=>`<button class="btn2 ghost" data-u="${esc(c.url)}">${ch.length>1?"Kanal "+(i+1):"Kanalga o'tish"}</button>`).join("")}<button class="btn2" id="rt">A'zo bo'ldim</button></div>`;
a.querySelectorAll("[data-u]").forEach(b=>b.onclick=()=>openUrl(b.dataset.u));
$("#rt").onclick=()=>boot(true);return}
a.innerHTML=`<div class="gate"><h2>${code=="banned"?"Hisob bloklangan":code=="auth"?"Qayta oching":code=="phone"?"Telefon tasdiqlanmagan":"Ochilmadi"}</h2><p class="mut">${msg}</p>${code=="banned"?"":`<button class="btn2" id="rt">${code=="auth"||code=="phone"?"Yopish":"Qayta urinish"}</button>`}</div>`;
const r=$("#rt");if(r)r.onclick=(code=="auth"||code=="phone")?()=>{if(tg)tg.close()}:()=>boot()}
async function boot(refresh){tpStop();$("#nav").innerHTML="";$("#app").innerHTML='<div class="skl"><i style="height:56px;width:72%"></i><i style="height:182px;border-radius:28px"></i><div class="grid" style="margin:0"><i style="height:96px"></i><i style="height:96px"></i><i style="height:96px"></i><i style="height:96px"></i></div><i style="height:210px;border-radius:26px"></i></div>';
try{const m=await load(refresh);if(!m)return;first=true;tab="home";home();setTimeout(FX.watch,400)}catch(e){fail(e)}}
boot();
/* ripple (to'lqin) va "Nusxalandi" belgisi — barcha tugmalarga */
document.addEventListener("pointerdown",e=>{if(!FX.on)return;const b=e.target.closest&&e.target.closest("button,.drop");if(!b||b.disabled||b.classList.contains("hold"))return;
const r=b.getBoundingClientRect(),d=Math.max(r.width,r.height)*2,i=document.createElement("i");i.className="rp";
i.style.cssText="width:"+d+"px;height:"+d+"px;left:"+(e.clientX-r.left-d/2)+"px;top:"+(e.clientY-r.top-d/2)+"px";
if(getComputedStyle(b).position=="static")b.style.position="relative";b.style.overflow="hidden";b.appendChild(i);setTimeout(()=>i.remove(),650)});
document.addEventListener("click",e=>{const c=e.target.closest&&e.target.closest(".cp");if(!c||c.dataset.o)return;c.dataset.o=c.textContent;c.textContent="✓ Nusxalandi";c.classList.add("okc");
setTimeout(()=>{c.textContent=c.dataset.o;delete c.dataset.o;c.classList.remove("okc")},1300)});
document.addEventListener("visibilitychange",()=>{if(document.hidden)return;if(TP.run&&cur&&cur.p)poll(cur.p,0);else if(ME)refresh()});
setInterval(()=>{if(!document.hidden&&ME&&!TP.run&&(ME.pending_topups>0||ME.open_payment))refresh()},15000);
</script>
</body>
