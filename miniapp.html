function holdBind(h){const f=h.querySelector("i");let t0=0,raf=0,done=false,kd=false,arm=0;
const stop=short=>{cancelAnimationFrame(raf);raf=0;if(!done){if(short&&t0&&!h.disabled)toast("Tugmani 1 soniya bosib turing");f.style.transition="transform .25s";f.style.transform="scaleX(0)"}t0=0};
const step=now=>{const p=Math.min((now-t0)/900,1);f.style.transform="scaleX("+p+")";if(p>=1){done=true;raf=0;t0=0;pay()}else raf=requestAnimationFrame(step)};
const start=()=>{if(h.disabled||raf)return;done=false;f.style.transition="none";t0=performance.now();raf=requestAnimationFrame(step)};
h.addEventListener("pointerdown",e=>{if(h.disabled)return;e.preventDefault();start()});
["pointerup","pointerleave","pointercancel"].forEach(ev=>h.addEventListener(ev,()=>{if(raf||t0)stop(ev=="pointerup")}));
/* klaviatura: Enter yoki Space ni 0.9 soniya bosib turish (sichqonchadagi kabi tasodifiy xariddan himoya) */
const isK=e=>e.key==" "||e.key=="Enter";
h.addEventListener("keydown",e=>{if(!isK(e))return;e.preventDefault();if(e.repeat||h.disabled)return;kd=true;start()});
h.addEventListener("keyup",e=>{if(!isK(e))return;e.preventDefault();if(kd){kd=false;if(raf||t0)stop(true)}});
h.addEventListener("blur",()=>{if(kd){kd=false;stop(false)}});
/* ekran o'qigich / dasturiy bosish (detail=0, klaviatura hodisasisiz): ikki marta bosib tasdiqlanadi */
h.addEventListener("click",e=>{if(e.detail||h.disabled)return;if(arm){clearTimeout(arm);arm=0;pay()}else{toast("Tasdiqlash uchun yana bir marta bosing");arm=setTimeout(()=>{arm=0},4000)}})}

const desc=()=>{const{t,a,u}=cur;return t=="stars"?fmt(a)+" Stars → @"+u:t=="premium"?"Premium, "+a+" oy → @"+u:t=="uc"?fmt(a)+" UC → ID "+u:P.cty[a][0]+" "+P.cty[a][1]+" raqami"};
async function pay(){hap();const{t}=cur,w=desc(),h=$("#hold");let p=price(),st="wait",nb=null,rr;
h.disabled=true;$("#hl").textContent="Bajarilmoqda…";$("#hp").textContent="";
const tok=cur.tok||(cur.tok=uuid());   /* bitta xarid = bitta token: tarmoq uzilib qayta yuborilsa, server ikkinchi marta yechmaydi */
try{rr=await call("/api/buy",{body:{token:tok,kind:t=="raqam"?"number":t,username:cur.u,amount:t=="raqam"?P.cty[cur.a][3]:t=="uc"?P.uc.find(x=>x[0]==cur.a)[2]:cur.a,price:p},timeout:60000});cur.tok=null;p=rr.price||p;nb=rr.balance;if(t=="stars"||t=="premium")st=rr.status=="ok"?"ok":"wait"}
catch(e){if(gateErr(e))return;if(e.code=="price_changed"){cur.tok=null;toast("Narx o'zgardi, qayta oching");return show(false)}
const hf=h.querySelector("i");if(hf){hf.style.transition="none";hf.style.transform="scaleX(0)"}
if(e.data&&e.data.balance!=null){bal=e.data.balance;if(ME)ME.balance=bal}
if(e.code=="net"){h.disabled=false;$("#hl").textContent="Qayta urinish — bosib turing";$("#hint").textContent="Aloqa uzildi. Xarid bajarilgan bo'lishi mumkin — qayta urinsangiz, pul ikki marta yechilmaydi.";return}   /* cur.tok saqlanadi */
if(e.code=="unknown"){loadedAt=0;refresh();upd();h.disabled=true;$("#hl").textContent="Buyurtmalarni tekshiring";$("#hp").textContent="";$("#hint").textContent=e.message;return}
cur.tok=null;upd();$("#hint").textContent=e.message;return}
const be=$("#bal"),old=bal;bal=nb!=null?nb:bal-p;if(be)countTo(be,old,bal);if(ME)ME.balance=bal;
saveUn(t,cur.u);ords.unshift({t,w,d:"Hozir",p,s:st,id:rr.order_id});renderOrd(true);show(false);
win(t,w,t=="raqam"&&rr.number?{num:rr.number,id:rr.order_id}:{h:st=="ok"?"Xarid bajarildi":"Buyurtma qabul qilindi",x:`<p class="mut">${st=="ok"?"Holatini «Buyurtmalar» bo'limidan ko'rishingiz mumkin.":"Natijani «Buyurtmalar» bo'limidan kuzating."}</p>`});
loadedAt=0;setTimeout(()=>refresh(),1200)}

function win(t,w,o){o=o||{};const e=$("#win");e.className="win on t-"+t;
e.innerHTML=`<div class="wrap"><div class="burst"><div class="core"><svg viewBox="0 0 24 24" width="52" height="52" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path class="ck" d="M5 12.5l4.5 4.5L19 7.5"/></svg></div></div><h2 class="fd">${esc(o.h||(t=="raqam"?"Raqam tayyor":"To'lov qabul qilindi"))}</h2><p class="mut fd" style="margin:0">${esc(w)}</p><div id="x" class="fd"></div><button type="button" class="btn2 fd" id="cl" data-af>Yopish</button></div>`;
$("#cl").onclick=()=>{e.classList.add("out");setTimeout(()=>e.classList.remove("on","out"),250)};
if(t=="raqam"&&!o.x)numFlow(o.num,o.id);else $("#x").innerHTML=o.x}
const codeHTML=(c,p)=>'<span style="display:grid;gap:12px;justify-items:center"><span class="code">'+[...String(c)].map((d,i)=>`<em style="--i:${i}">${esc(d)}</em>`).join("")+`</span><button type="button" class="cp" data-cc="${esc(c)}">Kodni nusxalash</button>`+(p?`<span class="num" style="margin:0"><b>2FA: ${esc(p)}</b><button type="button" class="cp" data-cc="${esc(p)}">Nusxalash</button></span>`:"")+"</span>";
const bindCc=r=>(r||document).querySelectorAll("[data-cc]").forEach(b=>b.onclick=()=>{hap();copy(b.dataset.cc)});
function numDone(c,p){const w=$("#wl");if(!w)return;w.dataset.done=1;w.innerHTML=codeHTML(c,p);hap();bindCc(w);["#nk","#nr"].forEach(k=>{const e=$(k);if(e)e.remove()})}
/* Raqam: kodni tekshirish / pulni qaytarish (server: /api/number/check va /api/number/refund) */
async function numAct(k,o,man){
try{const r=await call("/api/number/"+k,{body:{id:o.id}}),q=ords.find(x=>x.id==o.id);
if(r.status=="done"){if(q)q.s="ok";renderOrd();const w=$("#wl");
if(w&&$("#win").classList.contains("on"))numDone(r.code,r.password);
else{show(false);const nm=r.number?`<div class="num"><b>${esc(r.number)}</b><button type="button" class="cp" data-cc="${esc(r.number)}">Nusxalash</button></div>`:"";win("raqam",(q&&q.w)||"Raqam",{h:"SMS kodi keldi",x:nm+`<div class="waitl" id="wl">${codeHTML(r.code,r.password)}</div>`});bindCc($("#win"))}}
else if(r.status=="refunded"){const old=bal;bal=r.balance;if(ME)ME.balance=bal;if(q)q.s="ref";const w=$("#wl");if(w)w.dataset.done=1;paint(old);show(false);$("#win").classList.remove("on");toast("Qaytarildi: "+fmt(r.amount)+" so'm")}
else if(man)toast(r.status=="closed"?"Buyurtma yakunlangan":"Kod hali kelmagan")}
catch(e){if(gateErr(e))return;if(man)toast(e.message)}}
function numFlow(n,id){const x=$("#x");
x.innerHTML=`<div class="num"><b>${esc(n)}</b><button class="cp" id="cn">Nusxalash</button></div><div class="waitl" id="wl"><span class="dots"><i></i><i></i><i></i></span> SMS kutilmoqda</div><p class="mut" style="font-size:13px;margin:6px 0 0">Kod kelmasa, biroz kutib pulni qaytarib olasiz.</p><button class="btn2 ghost" id="nk">Kodni tekshirish</button><button class="btn2 dng" id="nr">Pulni qaytarish</button>`;
$("#cn").onclick=()=>copy(n);
$("#nk").onclick=()=>numAct("check",{id},1);$("#nr").onclick=()=>numAct("refund",{id},1);
const poll=async()=>{const w=$("#wl");if(!w||w.dataset.done||!$("#win").classList.contains("on"))return;await numAct("check",{id},0);setTimeout(poll,5000)};setTimeout(poll,4000)}

/* ===== BALANSNI TO'LDIRISH =====
   1) Avto-to'lov: server unikal summa + karta beradi, foydalanuvchi o'tkazadi, bot to'lovni o'zi aniqlab balansni to'ldiradi.
   2) Chek yuborish: foydalanuvchi chek rasmini yuklaydi, u adminlarga boradi va admin tasdiqlaydi (botdagidek). */
const TP={poll:0,cd:0,run:false,id:0,busy:0};
function tpStop(){clearTimeout(TP.poll);clearInterval(TP.cd);TP.poll=TP.cd=0;TP.run=false;TP.id++}
const tHead=t=>`<div class="grab"></div><div class="hd"><div class="ico">${IC.topup}</div><h2>${esc(t)}</h2></div>`;
const setErr=m=>{const e=$("#te");if(e){e.textContent=m||"";e.className="hint";if(m){void e.offsetWidth;e.className="hint err shk"}}};
const lim=()=>({mn:(ME&&ME.min_topup)||5000,mx:(ME&&ME.max_topup)||100000000});
const pNow=p=>p.server_time+(Date.now()-p._t0)/1000;   /* server soati bo'yicha "hozir": telefon soati noto'g'ri bo'lsa ham to'g'ri chiqadi */
const fsz=n=>n>=1048576?(n/1048576).toFixed(1)+" MB":Math.max(1,Math.round(n/1024))+" KB";
const uuid=()=>{try{return crypto.randomUUID()}catch(e){return Date.now().toString(36)+Math.random().toString(36).slice(2,12)}};
function openUrl(u){if(!/^https?:\/\//i.test(u))return;try{if(tg&&/^https:\/\/t\.me\//i.test(u)&&tg.openTelegramLink)tg.openTelegramLink(u);else if(tg&&tg.openLink)tg.openLink(u);else window.open(u,"_blank")}catch(e){}}
/* kirish cheklovlari (bloklangan / kanalga a'zo emas / initData eskirgan): sahifa o'rniga tushuntirish ko'rsatiladi */
function gateErr(e){if(e&&(e.code=="auth"||e.code=="banned"||e.code=="subscribe"||e.code=="phone")){fail(e);return true}return false}

function topup(a0){tpStop();
const a=+a0>0?Math.round(+a0):50000,mn=lim().mn,ready=!!(ME&&ME.autopay&&ME.autopay.ready),op=ME&&ME.open_payment,chips=[20000,50000,100000],s=$("#sh");
const resume=!!(op&&op._t0!=null&&op.expires_at-pNow(op)>10);
cur={t:"topup",a};s.className="sh t-topup";
s.innerHTML=`${tHead("Balansni to'ldirish")}${resume?`<button class="resume" id="tr"><span>Kutilayotgan avto-to'lov<b>${fmt(op.amount)} so'm</b></span>${IC.chev}</button>`:""}<label>Summa (eng kami ${fmt(mn)} so'm)</label><div class="row">${chips.map(n=>`<button class="opt${n==a?" sel":""}" data-a="${n}">${fmt(n)}</button>`).join("")}</div><input class="in" id="n" inputmode="numeric" placeholder="Boshqa summa" autocomplete="off" value="${chips.indexOf(a)<0?a:""}">${ready?`<button class="btn2 two" id="ta">Avto-to'lov<small>Karta orqali o'tkazing — balans o'zi to'ldiriladi</small></button>`:'<p class="hint">Avto-to\'lov hozir mavjud emas.</p>'}<button class="btn2 two${ready?" ghost":""}" id="tm">Chek yuborish<small>Chekni yuklang — admin tasdiqlaydi</small></button><p class="hint" id="te"></p>`;
const inp=$("#n"),opts=s.querySelectorAll(".opt"),chk=()=>{const v=+cur.a||0,l=lim();
if(!v){setErr("Summani tanlang yoki kiriting");return 0}
if(v<l.mn){setErr("Eng kami "+fmt(l.mn)+" so'm");return 0}
if(v>l.mx){setErr("Eng ko'pi "+fmt(l.mx)+" so'm");return 0}return v};
opts.forEach(b=>b.onclick=()=>{hap();opts.forEach(x=>x.classList.remove("sel"));b.classList.add("sel");cur.a=+b.dataset.a;inp.value="";setErr("")});
inp.oninput=()=>{opts.forEach(x=>x.classList.remove("sel"));const v=inp.value.replace(/\D/g,"").slice(0,9);if(v!==inp.value)inp.value=v;cur.a=v?+v:0;setErr("")};
const ta=$("#ta");if(ta)ta.onclick=()=>{const v=chk();if(v)autoFlow(v)};
$("#tm").onclick=()=>{const v=chk();if(v)manualFlow(v)};
const tr=$("#tr");if(tr)tr.onclick=()=>autoShow(op);
show(true)}

async function autoFlow(a){const b=$("#ta"),m=$("#tm");if(!b||b.disabled)return;b.disabled=true;if(m)m.disabled=true;setErr("");
try{const r=await call("/api/topup/auto",{body:{amount:a}}),p=r.payment;p._t0=Date.now();ME.open_payment=p;
if(!$("#sh").classList.contains("on"))return;           /* so'rov ketayotganda oyna yopilgan — to'lov "kutilayotgan" bo'lib qoladi */
autoShow(p)}
catch(e){if(gateErr(e))return;const b2=$("#ta"),m2=$("#tm");if(b2)b2.disabled=false;if(m2)m2.disabled=false;
if(e.code=="autopay_unavailable"){ME.autopay=Object.assign({},ME.autopay,{ready:false});return topup(a)}
setErr(e.message)}}

function autoShow(p){tpStop();TP.run=true;if(p._t0==null)p._t0=Date.now();cur={t:"topup",a:p.base||p.amount,p};
const s=$("#sh"),row=(l,v,c)=>`<div class="pr"><small>${l}</small><b>${esc(v)}</b><button class="cp" data-c="${esc(c)}">Nusxalash</button></div>`;
s.className="sh t-topup";
s.innerHTML=`${tHead("Avto-to'lov")}<div class="pc">${row("O'tkaziladigan summa",fmt(p.amount)+" so'm",p.amount)}${row("Karta raqami",p.card_number,p.card_raw||p.card_number)}${p.card_holder?`<div class="pr"><small>Karta egasi</small><b>${esc(p.card_holder)}</b></div>`:""}</div><div class="tm"><b id="tl">--:--</b><small>qoldi</small></div><div class="bar"><i id="tb"></i></div><p class="note">Summa aynan shunday bo'lishi shart${p.extra?`: oxirgi ${fmt(p.extra)} so'm to'lovni aniqlash uchun qo'shilgan (u ham balansingizga tushadi)`:""}. To'lov tushishi bilan balans o'zi to'ldiriladi.</p><div class="waitl" id="wl"><span class="dots"><i></i><i></i><i></i></span> To'lov kutilmoqda</div><button class="btn2 ghost" id="pm">Chek yuborish (qo'lda)</button><button class="btn2 dng" id="pc">Bekor qilish</button><p class="hint" id="te"></p>`;
s.querySelectorAll(".cp").forEach(b=>b.onclick=()=>copy(b.dataset.c));
$("#pm").onclick=()=>toManual(p);$("#pc").onclick=()=>cancelAuto(p);
show(true);tick(p);TP.cd=setInterval(()=>tick(p),1000);poll(p)}

function tick(p){const l=$("#tl"),b=$("#tb");if(!l)return;
const left=p.expires_at-pNow(p),total=Math.max(60,(p.ttl_min||20)*60);
if(left>0){const m=Math.floor(left/60),x=Math.floor(left%60);l.textContent=m+":"+String(x).padStart(2,"0");l.classList.remove("dim");if(b)b.style.transform="scaleX("+Math.max(0,Math.min(1,left/total))+")"}
else{l.textContent="0:00";l.classList.add("dim");if(b)b.style.transform="scaleX(0)";
const w=$("#wl");if(w&&!w.dataset.late){w.dataset.late="1";w.innerHTML='<span class="dots"><i></i><i></i><i></i></span> Vaqt tugadi. Pul o\'tkazgan bo\'lsangiz, bir oz kuting…'}}}

/* holatni so'rash: har ~4 soniyada; ilovaga qaytganda (bank ilovasidan) darhol */
function poll(p,d){const id=TP.id;clearTimeout(TP.poll);TP.poll=setTimeout(()=>check(p,id),d==null?4000:d)}
async function check(p,id){if(!TP.run||TP.id!==id||TP.busy===id)return;TP.busy=id;
try{const r=await call("/api/topup/auto/status?id="+p.id);if(!TP.run||TP.id!==id)return;
p.server_time=r.server_time;p._t0=Date.now();
if(r.status=="paid")return paid(r);
if(r.status=="cancelled")return gone("To'lov bekor qilingan.",p);
if(r.status=="expired"||r.server_time>r.expires_at+(r.grace||0))return gone("To'lov muddati tugadi. Pul o'tkazgan bo'lsangiz — chek yuboring, admin tekshiradi.",p)}
catch(e){if(!TP.run||TP.id!==id)return;if(gateErr(e))return;if(e.code=="not_found")return gone("So'rov topilmadi.",p)}
finally{if(TP.busy===id)TP.busy=0}
if(TP.run&&TP.id===id)poll(p)}

function paid(r){tpStop();LS++;const old=bal;bal=r.balance!=null?r.balance:old+(+r.amount||0);
if(ME){ME.open_payment=null;ME.balance=bal}
paint(old);show(false);hap();
win("topup","+"+fmt(r.amount)+" so'm",{h:"To'lov qabul qilindi",x:`<p class="mut">Yangi balans: <b style="color:var(--tx)">${fmt(bal)} so'm</b></p>`})}

function gone(m,p){tpStop();if(ME)ME.open_payment=null;const a=(p&&(p.base||p.amount))||cur.a,s=$("#sh");
s.className="sh t-topup";
s.innerHTML=`${tHead("To'lov yakunlanmadi")}<p class="mut" style="margin:14px 0 0">${esc(m)}</p><button class="btn2" id="g1">Qayta urinish</button><button class="btn2 ghost" id="g2">Chek yuborish</button>`;
$("#g1").onclick=()=>topup(a);$("#g2").onclick=()=>manualFlow(a);show(true)}

/* bot bilan bir xil: avto-to'lovdan qo'lda usulga o'tilsa, avto-so'rov bekor qilinadi (to'lov allaqachon tushgan bo'lsa — bekor bo'lmaydi) */
async function toManual(p){const b=$("#pm"),c=$("#pc");if(!b||b.disabled)return;b.disabled=true;if(c)c.disabled=true;setErr("");
try{const r=await call("/api/topup/auto/cancel",{body:{id:p.id}});
if(r.status=="paid")return paid(await call("/api/topup/auto/status?id="+p.id));
if(ME)ME.open_payment=null;manualFlow(p.base||p.amount)}
catch(e){if(gateErr(e))return;const b2=$("#pm"),c2=$("#pc");if(b2)b2.disabled=false;if(c2)c2.disabled=false;setErr(e.message)}}

async function cancelAuto(p){const b=$("#pc"),m=$("#pm");if(!b||b.disabled)return;b.disabled=true;if(m)m.disabled=true;setErr("");
try{const r=await call("/api/topup/auto/cancel",{body:{id:p.id}});
if(r.status=="paid")return paid(await call("/api/topup/auto/status?id="+p.id));
if(ME)ME.open_payment=null;toast("Bekor qilindi");topup(p.base||p.amount)}
catch(e){if(gateErr(e))return;const b2=$("#pc"),m2=$("#pm");if(b2)b2.disabled=false;if(m2)m2.disabled=false;setErr(e.message)}}

/* katta rasmni kichraytiradi (tez yuklanishi uchun) va JPG/PNG/WEBP bo'lmagan formatni (masalan HEIC) JPG ga aylantiradi */
async function shrink(f){const ok=/^image\/(jpeg|png|webp)$/.test(f.type);if(ok&&f.size<=1258291)return f;
try{const bm=await createImageBitmap(f),k=Math.min(1,1920/Math.max(bm.width,bm.height)),w=Math.max(1,Math.round(bm.width*k)),h=Math.max(1,Math.round(bm.height*k));
const cv=document.createElement("canvas");cv.width=w;cv.height=h;const cx=cv.getContext("2d");cx.fillStyle="#fff";cx.fillRect(0,0,w,h);cx.drawImage(bm,0,0,w,h);if(bm.close)bm.close();
const blob=await new Promise(r=>cv.toBlob(r,"image/jpeg",.86));if(blob&&(!ok||blob.size<f.size))return blob}catch(e){}
return f}

function manualFlow(a){tpStop();cur={t:"topup",a};
const c=(ME&&ME.card)||{},num=String(c.number||"").trim(),tok=uuid(),s=$("#sh");let file=null,prev="";
s.className="sh t-topup";
s.innerHTML=`${tHead("Chek yuborish")}<div class="sum"><span>O'tkaziladigan summa</span><b>${fmt(a)} so'm</b></div>${num?`<div class="card"><small>Karta raqami</small><b>${esc(num)}</b>${c.holder?`<small>${esc(c.holder)}</small>`:""}<button class="cp" id="cc">Nusxalash</button></div>`:'<p class="note">Karta ma\'lumoti kiritilmagan. Admin bilan bog\'laning.</p>'}<p class="hint" style="margin-top:12px">Pulni o'tkazgach, to'lov chekining skrinshotini yuklang. Admin tasdiqlagach balansingiz to'ldiriladi.</p><label class="drop" id="dz" tabindex="0" role="button"><input type="file" id="ph" accept="image/*" hidden><span id="dl">${IC.cam}<span>Chek rasmini tanlang<small>JPG yoki PNG</small></span></span></label><button class="btn2" id="sd" disabled>Adminga yuborish</button><button class="btn2 ghost" id="bk">Orqaga</button><p class="hint" id="te"></p>`;
const ph=$("#ph"),sd=$("#sd"),bk=$("#bk"),dz=$("#dz"),rel=()=>{if(prev){URL.revokeObjectURL(prev);prev=""}};
const cc=$("#cc");if(cc)cc.onclick=()=>copy(num.replace(/\D/g,"")||num);
dz.onkeydown=e=>{if(e.key=="Enter"||e.key==" "){e.preventDefault();ph.click()}};
ph.onchange=()=>{const f=ph.files&&ph.files[0];setErr("");rel();
if(!f){file=null;sd.disabled=true;return}
if(!/^image\//.test(f.type)&&!/\.(jpe?g|png|webp|heic|heif)$/i.test(f.name)){file=null;sd.disabled=true;return setErr("Faqat rasm yuklang (JPG yoki PNG)")}
file=f;prev=URL.createObjectURL(f);
$("#dl").innerHTML=`<img class="th2" alt="" src="${prev}"><span>${esc(f.name.length>26?f.name.slice(0,23)+"…":f.name)}<small>${fsz(f.size)} · almashtirish uchun bosing</small></span>`;sd.disabled=false};
bk.onclick=()=>{rel();topup(a)};
sd.onclick=async()=>{if(!file||sd.disabled)return;sd.disabled=bk.disabled=true;setErr("");const lb=sd.textContent;sd.textContent="Yuborilmoqda…";
try{const blob=await shrink(file),fd=new FormData();fd.append("amount",String(a));fd.append("token",tok);fd.append("photo",blob,"check.jpg");
const r=await call("/api/topup/manual",{body:fd,timeout:90000});rel();
ME.pending_topups=r.pending_topups!=null?r.pending_topups:(ME.pending_topups||0)+1;
show(false);pill();hap();
win("topup",fmt(a)+" so'm",{h:"Chek adminga yuborildi",x:'<p class="mut">Admin tasdiqlagach balansingiz to\'ldiriladi. Natija botda xabar bo\'lib keladi.</p>'})}
catch(e){if(gateErr(e))return;sd.disabled=bk.disabled=false;sd.textContent=lb;setErr(e.message)}};
show(true)}

/* ===== Ishga tushirish va xatolar ===== */
function fail(e){tpStop();show(false);$("#win").classList.remove("on");$("#nav").innerHTML="";
const a=$("#app"),code=e&&e.code,ch=(e&&e.data&&e.data.channels)||[],msg=esc((e&&e.message)||"Xatolik yuz berdi");
if(code=="subscribe"){
a.innerHTML=`<div class="gate"><h2>Kanalga a'zo bo'ling</h2><p class="mut">${msg}</p>${ch.map((c,i)=>`<button class="btn2 ghost" data-u="${esc(c.url)}">${ch.length>1?"Kanal "+(i+1):"Kanalga o'tish"}</button>`).join("")}<button class="btn2" id="rt">A'zo bo'ldim</button></div>`;
a.querySelectorAll("[data-u]").forEach(b=>b.onclick=()=>openUrl(b.dataset.u));
$("#rt").onclick=()=>boot(true);return}
a.innerHTML=`<div class="gate"><h2>${code=="banned"?"Hisob bloklangan":code=="auth"?"Qayta oching":code=="phone"?"Telefon tasdiqlanmagan":"Ochilmadi"}</h2><p class="mut">${msg}</p>${code=="banned"?"":`<button class="btn2" id="rt">${code=="auth"||code=="phone"?"Yopish":"Qayta urinish"}</button>`}</div>`;
const r=$("#rt");if(r)r.onclick=(code=="auth"||code=="phone")?()=>{if(tg)tg.close()}:()=>boot()}
async function boot(refresh){tpStop();$("#nav").innerHTML="";$("#app").innerHTML='<div class="skl"><i style="height:56px;width:72%"></i><i style="height:182px;border-radius:28px"></i><div class="grid" style="margin:0"><i style="height:96px"></i><i style="height:96px"></i><i style="height:96px"></i><i style="height:96px"></i></div><i style="height:210px;border-radius:26px"></i></div>';
try{const m=await load(refresh);if(!m)return;first=true;tab="home";home();setTimeout(FX.watch,400)}catch(e){fail(e)}}
boot();
/* "Nusxalandi" belgisi */
document.addEventListener("click",e=>{const c=e.target.closest&&e.target.closest(".cp");if(!c||c.dataset.o)return;c.dataset.o=c.textContent;c.textContent="✓ Nusxalandi";c.classList.add("okc");
setTimeout(()=>{c.textContent=c.dataset.o;delete c.dataset.o;c.classList.remove("okc")},1300)});
document.addEventListener("visibilitychange",()=>{if(document.hidden)return;if(TP.run&&cur&&cur.p)poll(cur.p,0);else if(ME)refresh()});
setInterval(()=>{if(!document.hidden&&ME&&!TP.run&&(ME.pending_topups>0||ME.open_payment))refresh()},15000);
/* ===== KLAVIATURA BILAN ISHLASH =====
   Tab / Shift+Tab — tugmalar bo'ylab; ← ↑ → ↓ — eng yaqin tugmaga (joylashuv bo'yicha); Enter / Space — bosish; Esc — oynani yopish.
   Oyna (sheet / muvaffaqiyat) ochiq bo'lsa: orqa fon "inert" (fokus chiqib ketmaydi), fokus oyna ichida aylanadi, yopilganda
   oldingi tugmaga qaytadi. Tez tugmalar harf joylashuviga bog'liq emas (e.code): 1–4 xizmatlar, T to'ldirish, H O Y P sahifalar,
   C ranglar, A animatsiya, ? yordam. html.kb — oxirgi amal klaviatura bo'lsa (tugma belgilarini ko'rsatadi). */
const KB=(()=>{const R=document.documentElement;let on=false,layer=null,opener=null,lastF=null;
const flag=v=>{if(on!==v){on=v;R.classList.toggle("kb",v)}};
const typing=t=>!!t&&(t.isContentEditable||/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName));
const top=()=>$("#win").classList.contains("on")?$("#win"):$("#sh").classList.contains("on")?$("#sh"):null;
const vis=e=>{if(e.closest("[hidden],[inert]"))return false;const r=e.getBoundingClientRect();if(!r.width&&!r.height)return false;const c=getComputedStyle(e);return c.visibility!="hidden"&&c.display!="none"};
const ok=e=>!!e&&document.contains(e)&&!e.disabled&&vis(e);
const SEL="button,a[href],a[tabindex],input,select,textarea,summary,[tabindex]";
const items=root=>[...root.querySelectorAll(SEL)].filter(e=>e.tabIndex>=0&&!e.disabled&&e.type!="hidden"&&vis(e));
const focusIn=t=>{let el=lastF&&t.contains(lastF)&&ok(lastF)?lastF:null;
if(!el&&on){const a=t.querySelector("[data-af]");el=ok(a)?a:items(t)[0]}
(el||t).focus({preventScroll:true})};
const close=L=>{if(L.id=="win"){const c=$("#cl");if(c)c.click();else L.classList.remove("on")}else show(false)};
/* yo'nalish bo'yicha eng yaqin element */
const dirNav=(k,from)=>{const list=items(top()||document.body).filter(e=>e!==from&&!from.contains(e)&&!e.contains(from)),a=from.getBoundingClientRect(),cx=a.left+a.width/2,cy=a.top+a.height/2;let best=null,bs=1e9;
for(const e of list){const r=e.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2,dx=x-cx,dy=y-cy;let m,g,o;
if(k=="ArrowDown"){if(dy<=4)continue;m=dy;g=Math.max(0,r.left-a.right,a.left-r.right);o=Math.abs(dx)}
else if(k=="ArrowUp"){if(dy>=-4)continue;m=-dy;g=Math.max(0,r.left-a.right,a.left-r.right);o=Math.abs(dx)}
else if(k=="ArrowRight"){if(dx<=4)continue;m=dx;g=Math.max(0,r.top-a.bottom,a.top-r.bottom);o=Math.abs(dy)}
else{if(dx>=-4)continue;m=-dx;g=Math.max(0,r.top-a.bottom,a.top-r.bottom);o=Math.abs(dy)}
const s=m+g*3+o*.3;if(s<bs){bs=s;best=e}}
if(!best)return false;best.focus({preventScroll:true});try{best.scrollIntoView({block:"nearest"})}catch(e){}return true};
/* oyna ochilishi/yopilishi: inert, aria, fokus */
const sync=()=>{const t=top();
if(t===layer){if(t){if(!t.contains(document.activeElement))focusIn(t);
t.querySelectorAll(".opt").forEach(o=>{const v=String(o.classList.contains("sel"));if(o.getAttribute("aria-pressed")!==v)o.setAttribute("aria-pressed",v)});
const h=t.querySelector("h2");if(h&&!h.id)h.id=t.id+"-t";if(h&&t.getAttribute("aria-labelledby")!==h.id)t.setAttribute("aria-labelledby",h.id)}return}
const was=layer;layer=t;
["#app","#nav","#demob"].forEach(s=>{const e=$(s);if(!e)return;if(t){e.setAttribute("inert","");e.setAttribute("aria-hidden","true")}else{e.removeAttribute("inert");e.removeAttribute("aria-hidden")}});
const sh=$("#sh");if(t&&t.id=="win")sh.setAttribute("inert","");else sh.removeAttribute("inert");
if(t){if(!was){const a=document.activeElement;opener=a&&a!==document.body&&!a.closest("#sh,#win")?a:null;lastF=null}
t.setAttribute("role","dialog");t.setAttribute("aria-modal","true");t.tabIndex=-1;
const h=t.querySelector("h2");if(h){if(!h.id)h.id=t.id+"-t";t.setAttribute("aria-labelledby",h.id)}
focusIn(t)}
else{lastF=null;const o=opener;opener=null;
if(o&&ok(o))o.focus({preventScroll:true});
else if(on){const n=$("#nav .on")||$("#nav button");if(n&&ok(n))n.focus({preventScroll:true});else $("#app").focus({preventScroll:true})}}};
const mo=new MutationObserver(sync);
["#sh","#win"].forEach(s=>mo.observe($(s),{attributes:true,attributeFilter:["class"],childList:true,subtree:true}));
document.addEventListener("focusin",e=>{if(layer&&layer.contains(e.target))lastF=e.target});
addEventListener("pointerdown",()=>flag(false),true);
/* yordam oynasi */
const help=()=>{hap();const s=$("#sh");s.className="sh";
const K=(a,t)=>`<div class="kr"><div>${t}</div><span>${a.map(x=>`<kbd>${x}</kbd>`).join("")}</span></div>`;
s.innerHTML=`<div class="grab"></div><div class="hd"><div class="ico t-topup">${IC.kbd}</div><h2>Tez tugmalar</h2></div><div class="ks"><h3>Sahifalar</h3>${K(["1","2","3","4"],"Stars, Premium, Raqam, UC")}${K(["T"],"Balansni to'ldirish")}${K(["H"],"Bosh sahifa")}${K(["O"],"Buyurtmalar")}${K(["Y"],"Qo'llab-quvvatlash")}${K(["P"],"Profil")}<h3>Sozlamalar</h3>${K(["C"],"Rang mavzusi")}${K(["A"],"Animatsiyalar")}${K(["?"],"Shu oyna")}<h3>Boshqaruv</h3>${K(["Tab"],"Keyingi tugma")}${K(["←","↑","→","↓"],"Tugmalar orasida yurish")}${K(["Enter","Space"],"Tanlash")}${K(["Esc"],"Oynani yopish")}${K(["Enter ⏱"],"Sotib olish: 1 soniya bosib turing")}</div><button type="button" class="btn2 ghost" data-close>Yopish</button>`;show(true)};
document.addEventListener("keydown",e=>{const k=e.key,t=e.target,L=top();
if(k=="Tab"){flag(true);if(!L)return;const it=items(L);if(!it.length){e.preventDefault();L.focus({preventScroll:true});return}
const ae=document.activeElement,f=it[0],l=it[it.length-1];
if(it.indexOf(ae)<0){e.preventDefault();(e.shiftKey?l:f).focus()}
else if(e.shiftKey&&ae===f){e.preventDefault();l.focus()}
else if(!e.shiftKey&&ae===l){e.preventDefault();f.focus()}return}
if(e.ctrlKey||e.metaKey||e.altKey)return;
if(k=="Escape"){if(L){flag(true);e.preventDefault();close(L)}return}
if(k.indexOf("Arrow")==0){if(!t||t===document.body||t===document.documentElement)return;
const rd=t.closest&&t.closest('[role="radio"]');
if(rd){const g=rd.closest('[role="radiogroup"]'),rs=g?[...g.querySelectorAll('[role="radio"]')]:[],i=rs.indexOf(rd);
if(i>=0){flag(true);e.preventDefault();const n=rs[(i+(k=="ArrowRight"||k=="ArrowDown"?1:rs.length-1))%rs.length];n.focus();n.click();return}}
if(typing(t)&&(k=="ArrowLeft"||k=="ArrowRight"))return;
flag(true);if(dirNav(k,t))e.preventDefault();return}
if(k=="Enter"&&t.matches&&t.matches(".in")&&L===$("#sh")){e.preventDefault();flag(true);
const ta=cur&&cur.t=="topup"?($("#ta")&&!$("#ta").disabled?$("#ta"):($("#tm")&&!$("#tm").disabled?$("#tm"):null)):null;
if(ta){ta.click();return}
const hb=$("#hold");if(hb&&!hb.disabled&&vis(hb)){hb.focus();return}
if(!dirNav("ArrowDown",t))t.blur();return}
if((k=="Enter"||k==" ")&&t.matches&&t.matches('a[role="button"]')){e.preventDefault();t.click();return}
/* tez tugmalar */
if(L||typing(t)||e.repeat||!ME||!$("#nav").children.length)return;
const c=e.code,dg=/^(?:Digit|Numpad)([1-4])$/.exec(c);let m=null;
if(dg){const key=Object.keys(SV)[+dg[1]-1];m=()=>{if(tab!="home")go("home");hap();openSheet(key)}}
else if(c=="KeyT")m=()=>{hap();topup()};
else if(c=="KeyH")m=()=>go("home");else if(c=="KeyO")m=()=>go("orders");else if(c=="KeyY")m=()=>go("help");else if(c=="KeyP")m=()=>go("me");
else if(c=="KeyC")m=()=>PAL.sheet();else if(c=="KeyA")m=()=>FX.toggle();
else if(c=="Slash"||k=="?")m=help;
if(m){e.preventDefault();flag(true);m()}});
document.addEventListener("click",e=>{const t=e.target.closest&&e.target.closest("[data-pk],[data-md],.pxb,[data-kbh],[data-close]");if(!t)return;
if(t.dataset.pk)PAL.setPal(t.dataset.pk);else if(t.dataset.md)PAL.setMode(t.dataset.md);else if(t.classList.contains("pxb"))PAL.sheet();else if(t.dataset.kbh!=null)help();else show(false)});
return{help,sync,flag}})();

</script>
